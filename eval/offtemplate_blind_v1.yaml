- id: b19
  tier: core
  utterance: "furosemide forty IV"
  expected: [{drug: furosemide, dose: 40, unit: null, route: IV, time: null, status: given}]
  expected_flags: [unit missing]
- id: b20
  tier: core
  utterance: "IV access established, eighteen gauge, right hand"
