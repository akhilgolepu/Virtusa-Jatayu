    - {drug: metoclopramide, dose: 10, unit: mg, route: IV, time: null, status: given}
- id: b24
  tier: core
  utterance: "gave adrenaline point three, no, zero point five milligram IM"
  expected: [{drug: epinephrine, dose: 0.5, unit: mg, route: IM, time: null, status: given}]
