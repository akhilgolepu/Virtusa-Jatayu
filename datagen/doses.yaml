# SYNTHETIC-DATA dose values: typical doses as a responder might SAY them, used only to generate
# training/test utterances. NOT validator ranges and NOT clinical guidance — the validator's dose
# ranges come from the NASEMSO National Model EMS Clinical Guidelines in Plan 3.
# Every (route, unit) must be allowed for the drug in jatayu/lexicon/drugs.yaml (tested).
epinephrine:
  - {route: IM, unit: mg, values: [0.3, 0.5, 0.15]}
  - {route: IV, unit: mg, values: [1]}
  - {route: IO, unit: mg, values: [1]}
  - {route: NEB, unit: mg, values: [5]}
norepinephrine:
  - {route: IV, unit: mcg, values: [4, 8, 10]}
amiodarone:
  - {route: IV, unit: mg, values: [300, 150]}
adenosine:
  - {route: IV, unit: mg, values: [6, 12]}
atropine:
  - {route: IV, unit: mg, values: [0.5, 1]}
aspirin:
  - {route: PO, unit: mg, values: [300, 325, 162]}
nitroglycerin:
  - {route: SL, unit: mg, values: [0.4]}
  - {route: SL, unit: mcg, values: [400]}
naloxone:
